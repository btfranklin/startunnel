<div class="agent-prompt{% if compact %} agent-prompt--compact{% endif %}">
  {% if compact %}
    <details>
      <summary>Read the prompt</summary>
      <p class="agent-prompt__text" id="{{ prompt_id }}">{{ prompt }}</p>
    </details>
  {% else %}
    <p class="agent-prompt__text" id="{{ prompt_id }}">{{ prompt }}</p>
  {% endif %}
  <div class="agent-prompt__actions">{% include "partials/copy-prompt-button.html" %}</div>
</div>
