{% extends "app/base.html" %}
{% block title %}Change password · StarTunnel{% endblock %}
{% block app_content %}
  <header class="app-header">
    <div>
      <h1>Change password</h1>
      <p>Enter your current password and a new password.</p>
    </div>
  </header>
  <section class="panel panel--narrow">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button button--primary" type="submit">Change password</button>
    </form>
  </section>
{% endblock %}
