[project]
name = "startunnel"
description = "A stable message board for authenticated AI agents"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "B.T. Franklin" },
]
dynamic = ["version"]
dependencies = ["Django>=6.1.2", "django-ninja>=1.7.1", "django-htmx>=1.29.0", "psycopg[binary,pool]>=3.3.6", "uvicorn[standard]>=0.54.0", "argon2-cffi>=25.1.0", "prometheus-client>=0.26.0", "markdown-it-py>=4.2.0", "mdit-py-plugins>=0.6.1", "Pygments>=2.21.0", "dj-database-url>=3.1.2", "httpx>=0.28.1", "python-dotenv>=1.2.4", "cryptography>=50.0.2", "sqlparse>=0.6.0", "pydantic>=2.14.1"]

[dependency-groups]
dev = [
    { include-group = "live-agents" },
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.170.9",
    "time-machine>=3.5.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djlint>=1.47.0",
    "openapi-spec-validator>=0.9.0",
    "jsonschema>=4.26.0",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.64.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "linkbust>=0.1.0",
    "PyYAML>=6.0.3",
    "types-jsonschema>=4.26.0.20261006",
    "types-Pygments>=2.21.0.20260819",
]
live-agents = [
    "openai-agents>=0.24.0",
]

[build-system]
requires = ["pdm-backend>=2.5.0"]
build-backend = "pdm.backend"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.per-file-target-version]
"cli/*.py" = "py310"
"tests/cli_standalone.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/*/migrations/*.py" = ["E501", "RUF012"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "startunnel.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "postgres: requires PostgreSQL",
    "sqlite_only: tests a non-PostgreSQL dependency or deliberately invalid database state",
    "browser: requires a browser",
    "live_agents: spends OpenAI API credits",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*", "*/settings/*", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.15"
mypy_path = "src"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = ["ignore-without-code"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.django-stubs]
django_settings_module = "startunnel.settings.test"

[[tool.mypy.overrides]]
module = ["tests.load.profile", "tests.load.run_profile"]
disallow_any_expr = true

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100

[tool.pdm]
distribution = false

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
docs-structure = "perfect-doc check . --offline --no-banner"
docs-links = "python -m scripts.check_markdown_links"
manage = "python manage.py"
dev = "python scripts/start_development.py"
test = "pytest"
test-postgres = { composite = ["pytest tests/integration -m postgres --cov=src --cov-branch --cov-report=json:postgres-coverage.json --cov-fail-under=0", "python scripts/check_critical_coverage.py postgres-coverage.json --postgres", "pytest tests/unit tests/api --no-cov"] }
check = "python scripts/check.py"
mypy = { cmd = "mypy", env = { PYTHONPATH = "src" } }
types = "python -m scripts.check_types"
openapi = { composite = ["python manage.py export_openapi --output generated/openapi.json", "python scripts/generate_client_contract.py"] }
inspect = "python manage.py inspect_runtime"
async-tasks = "python -m asyncio ps"
async-tree = "python -m asyncio pstree"
profile = "python -m profiling.sampling"
load-profile = "python scripts/run_full_load_profile.py"
production-up = "python scripts/start_production.py"
postgres-credentials = "python scripts/rotate_postgres_passwords.py"
security-release = "python scripts/run_security_release.py"
release-status = "python scripts/release_status.py"
