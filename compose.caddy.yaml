services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5}
    profiles:
      - edge
    environment:
      STARTUNNEL_DOMAIN: ${STARTUNNEL_DOMAIN:-proxy-proof.internal}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.254
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    restart: always
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "7"
        compress: "true"
