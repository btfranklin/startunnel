services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      STARTUNNEL_DB_RUNTIME_PASSWORD: ""
    secrets:
      - postgres_admin_password
      - postgres_runtime_password
    restart: always

  migrate:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_ADDRESS_SECRET: ""
      STARTUNNEL_ADDRESS_DERIVATION_SECRET: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_BASE_URL: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,172.16.0.0/12}
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_address_secret
      - startunnel_address_derivation_secret
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_admin_password

  web:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_ADDRESS_SECRET: ""
      STARTUNNEL_ADDRESS_DERIVATION_SECRET: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_BASE_URL: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,172.16.0.0/12}
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
      PROMETHEUS_MULTIPROC_DIR: /tmp/startunnel-prometheus
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_address_secret
      - startunnel_address_derivation_secret
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_runtime_password
    restart: always

  maintenance:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_ADDRESS_SECRET: ""
      STARTUNNEL_ADDRESS_DERIVATION_SECRET: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_BASE_URL: https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,172.16.0.0/12}
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_address_secret
      - startunnel_address_derivation_secret
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_admin_password
    restart: always

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    profiles:
      - edge
    environment:
      STARTUNNEL_DOMAIN: ${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN for the TLS edge}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - startunnel
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    restart: always
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "7"
        compress: "true"

secrets:
  startunnel_secret_key:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_secret_key
  startunnel_api_key_pepper:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_api_key_pepper
  startunnel_address_secret:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_address_secret
  startunnel_address_derivation_secret:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_address_derivation_secret
  startunnel_idempotency_secret:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_idempotency_secret
  startunnel_metrics_token:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_metrics_token
  postgres_admin_password:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/postgres_admin_password
  postgres_runtime_password:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/postgres_runtime_password

volumes:
  caddy_data:
  caddy_config:
