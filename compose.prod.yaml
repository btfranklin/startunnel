services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      STARTUNNEL_DB_RUNTIME_PASSWORD: ""
    secrets:
      - postgres_admin_password
      - postgres_runtime_password
    restart: always

  migrate:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_ALLOWED_HOSTS:-${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: ${STARTUNNEL_CSRF_TRUSTED_ORIGINS:-}
      STARTUNNEL_BASE_URL: ${STARTUNNEL_BASE_URL:-https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8},${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.254/32
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_admin_password

  web:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_ALLOWED_HOSTS:-${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: ${STARTUNNEL_CSRF_TRUSTED_ORIGINS:-}
      STARTUNNEL_BASE_URL: ${STARTUNNEL_BASE_URL:-https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8},${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.254/32
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
      PROMETHEUS_MULTIPROC_DIR: /tmp/startunnel-prometheus
    networks:
      startunnel: {}
      proxy: {}
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_runtime_password
    restart: always

  maintenance:
    build: !reset null
    image: ${STARTUNNEL_APP_IMAGE:?Set STARTUNNEL_APP_IMAGE to an immutable image reference}
    environment:
      DJANGO_SETTINGS_MODULE: startunnel.settings.production
      STARTUNNEL_ENV: production
      STARTUNNEL_SECRET_KEY: ""
      STARTUNNEL_API_KEY_PEPPER: ""
      STARTUNNEL_IDEMPOTENCY_SECRET: ""
      STARTUNNEL_METRICS_TOKEN: ""
      STARTUNNEL_ALLOWED_HOSTS: ${STARTUNNEL_ALLOWED_HOSTS:-${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_CSRF_TRUSTED_ORIGINS: ${STARTUNNEL_CSRF_TRUSTED_ORIGINS:-}
      STARTUNNEL_BASE_URL: ${STARTUNNEL_BASE_URL:-https://${STARTUNNEL_DOMAIN:?Set STARTUNNEL_DOMAIN}}
      STARTUNNEL_TRUSTED_PROXY_CIDRS: ${STARTUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8},${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.254/32
      DATABASE_URL: ""
      DATABASE_ADMIN_URL: ""
    secrets:
      - startunnel_secret_key
      - startunnel_api_key_pepper
      - startunnel_idempotency_secret
      - startunnel_metrics_token
      - postgres_admin_password
    restart: always

  caddy:
    extends:
      file: compose.caddy.yaml
      service: caddy

secrets:
  startunnel_secret_key:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_secret_key
  startunnel_api_key_pepper:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_api_key_pepper
  startunnel_idempotency_secret:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_idempotency_secret
  startunnel_metrics_token:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/startunnel_metrics_token
  postgres_admin_password:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/postgres_admin_password
  postgres_runtime_password:
    file: ${STARTUNNEL_SECRETS_DIR:-./secrets}/postgres_runtime_password

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    ipam:
      config:
        - subnet: ${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.0/24
          ip_range: ${STARTUNNEL_PROXY_IPV4_PREFIX:-172.30.254}.0/25
