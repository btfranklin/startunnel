name: Publish StarTunnel release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, notes, and main ancestry
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/release_record.py --check "$RELEASE_VERSION"
          git merge-base --is-ancestor HEAD origin/main

  ci:
    needs: candidate
    uses: ./.github/workflows/ci.yml

  validation:
    needs: ci
    uses: ./.github/workflows/release-validation.yml

  publish:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select official repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Assemble deployment record
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: python3 scripts/release_record.py --write "$RELEASE_VERSION" "$RELEASE_IMAGE"
      - name: Create draft release for operator review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" release.json \
            --verify-tag --draft --title "StarTunnel $RELEASE_VERSION" \
            --notes-file release-notes.md
