name: Release candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Reuse completed validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      reuse_run_id: ${{ steps.select.outputs.reuse_run_id }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select validation for this exact commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_candidate.py --prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.reuse_run_id == ''
    name: Build one release image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.record.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select release version
        id: version
        run: echo "version=$(python3 scripts/release_candidate.py --version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
          tags: ghcr.io/btfranklin/startunnel:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            STARTUNNEL_CLIENT_VERSION=${{ steps.version.outputs.version }}
            STARTUNNEL_SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/btfranklin/startunnel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Record candidate digest
        id: record
        env:
          CANDIDATE_IMAGE: ghcr.io/btfranklin/startunnel@${{ steps.build.outputs.digest }}
          SOURCE_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
        run: |
          python3 scripts/release_candidate.py --record "$CANDIDATE_IMAGE" --source-run-id "$SOURCE_VALIDATION_RUN_ID"
          echo "image=$CANDIDATE_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-image
          path: artifacts/candidate-image.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  validation:
    needs: build
    uses: ./.github/workflows/release-validation.yml
    with:
      candidate_image: ${{ needs.build.outputs.image }}

  evidence:
    name: Retain validated promotion record
    needs: [build, validation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-image
          path: artifacts/promotion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: security-reports-${{ github.run_id }}
          path: artifacts/promotion/security
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: system-proof-${{ github.run_id }}
          path: artifacts/promotion/system
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: load-proof-${{ github.run_id }}
          path: artifacts/promotion/load
      - run: python3 scripts/release_candidate.py --verify artifacts/promotion
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate
          path: artifacts/promotion
          overwrite: true
          if-no-files-found: error
          retention-days: 90
