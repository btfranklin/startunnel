name: Promotional website

on:
  pull_request:
    paths:
      - "website/**"
      - "static/**"
      - "skills/startunnel/**"
      - "generated/openapi.json"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "static/**"
      - "skills/startunnel/**"
      - "generated/openapi.json"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - name: Install locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.29.3"
          pdm install --prod --frozen-lockfile --no-self
      - name: Read Pages configuration
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static website
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://startunnel.net' }}
        run: >-
          pdm run python website/build.py
          --output website/dist
          --base-path "$BASE_PATH"
          --repository-url "$REPOSITORY_URL"
          --site-url "$SITE_URL"
      - name: Upload website only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
