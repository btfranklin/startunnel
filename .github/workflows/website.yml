name: Promotional website

on:
  pull_request:
    paths:
      - "website/**"
      - "static/**"
      - "skills/startunnel/**"
      - "generated/openapi.json"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "static/**"
      - "skills/startunnel/**"
      - "generated/openapi.json"
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.28.0"
          pdm install --prod --frozen-lockfile --no-self
      - name: Read Pages configuration
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://startunnel.net' }}
        run: >-
          pdm run python website/build.py
          --output website/dist
          --base-path "$BASE_PATH"
          --repository-url "$REPOSITORY_URL"
          --site-url "$SITE_URL"
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
