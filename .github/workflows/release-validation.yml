name: Release validation

on:
  workflow_call:
    inputs:
      candidate_image:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      candidate_image:
        description: Optional immutable candidate digest to validate
        required: false
        type: string
        default: ""
      run_live_agents:
        description: Spend provider credit on the bounded live-agent proof.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: release-validation-${{ github.sha }}
  cancel-in-progress: false

env:
  PDM_CHECK_UPDATE: "false"

jobs:
  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install release scanners
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive=gitleaks_8.28.0_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.28.0
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_8.28.0_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          tool_dir="$RUNNER_TEMP/trivy"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive=trivy_0.75.0_Linux-64bit.tar.gz
          base=https://github.com/aquasecurity/trivy/releases/download/v0.75.0
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/trivy_0.75.0_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          gitleaks version
          trivy --version
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.candidate_image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the immutable candidate
        if: inputs.candidate_image != ''
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: docker pull "$CANDIDATE_IMAGE"
      - name: Run the fail-closed security lane
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          args=()
          if [[ -n "$CANDIDATE_IMAGE" ]]; then
            args=(--skip-build --image "$CANDIDATE_IMAGE")
          fi
          python3 scripts/run_security_release.py image "${args[@]}"
      - name: Record the security proof attempt
        if: always()
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          PROOF_STATUS: ${{ job.status }}
        run: >-
          python3 scripts/release_candidate.py --proof security
          --candidate-image "$CANDIDATE_IMAGE" --proof-status "$PROOF_STATUS"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/
            artifacts/proof-security.json
          if-no-files-found: warn
          retention-days: 90

  system:
    name: Isolated clean-stack system proof
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.candidate_image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/proof-build
      - name: Run the isolated system proof
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          args=()
          if [[ -n "$CANDIDATE_IMAGE" ]]; then
            args=(--candidate-image "$CANDIDATE_IMAGE")
          fi
          python3 scripts/run_isolated_test_lane.py system "${args[@]}" \
            --project-name strelease-system-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record the system proof attempt
        if: always()
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          PROOF_STATUS: ${{ job.status }}
        run: >-
          python3 scripts/release_candidate.py --proof system
          --candidate-image "$CANDIDATE_IMAGE" --proof-status "$PROOF_STATUS"
      - name: Upload the safe system report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/system-proof-*.json
            artifacts/proof-system.json
            artifacts/proof-build-*.json
            artifacts/proof-build-failure-*.log
          if-no-files-found: error
          retention-days: 90

  full-load:
    name: Isolated fixed load proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.candidate_image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/proof-build
      - name: Run the isolated load proof
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          args=()
          if [[ -n "$CANDIDATE_IMAGE" ]]; then
            args=(--candidate-image "$CANDIDATE_IMAGE")
          fi
          python3 scripts/run_full_load_profile.py "${args[@]}" \
            --project-name strelease-load-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record the load proof attempt
        if: always()
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          PROOF_STATUS: ${{ job.status }}
        run: >-
          python3 scripts/release_candidate.py --proof load
          --candidate-image "$CANDIDATE_IMAGE" --proof-status "$PROOF_STATUS"
      - name: Upload the safe load report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/load-profile-*.json
            artifacts/load-profile-*.driver.jsonl
            artifacts/load-run-*.json
            artifacts/load-observations-*.jsonl
            artifacts/proof-load.json
            artifacts/proof-build-*.json
            artifacts/proof-build-failure-*.log
          if-no-files-found: error
          retention-days: 90

  live-agents:
    name: Opt-in live-agent proof
    if: ${{ inputs.run_live_agents }}
    needs:
      - security
      - system
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the isolated opt-in proof
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: >-
          python3 scripts/run_isolated_test_lane.py live-agents
          --allow-openai-cost
          --project-name strelease-live-${{ github.run_id }}-${{ github.run_attempt }}
