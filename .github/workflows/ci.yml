name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PDM_CHECK_UPDATE: "false"

jobs:
  standalone-cli:
    name: CLI (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run without project dependencies
        run: python tests/cli_standalone.py

  canonical:
    name: Canonical locked gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the locked tools and dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.28.0"
          pdm install --frozen-lockfile --no-self
      - name: Install the source secret scanner
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive=gitleaks_8.28.0_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.28.0
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_8.28.0_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Check source before service builds
        run: pdm run security-release source
      - name: Upload source scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-security-${{ github.run_id }}
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 90
      - name: Install Perfect Doc
        run: |
          tool_dir="$RUNNER_TEMP/perfect-doc"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive=perfect-doc-0.1.0-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/btfranklin/perfect-doc/releases/download/v0.1.0
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive"
          echo "$tool_dir/perfect-doc-0.1.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Run the canonical gate
        run: pdm run check

  postgres:
    name: PostgreSQL
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the isolated service lane
        run: >-
          python3 scripts/run_isolated_test_lane.py postgres
          --project-name stci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Set up Python for the restored baseline proof
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install locked proof dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.28.0"
          pdm install --frozen-lockfile --no-self
      - name: Prove admin upgrade on a restored initial baseline
        run: pdm run python scripts/prove_admin_upgrade.py
      - name: Prove upgrade and recovery from published v0.1.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin refs/tags/v0.1.0:refs/tags/v0.1.0
          gh release download v0.1.0 --pattern release.json --dir "$RUNNER_TEMP/startunnel-v0.1.0"
          pdm run python scripts/prove_admin_upgrade.py --baseline-record "$RUNNER_TEMP/startunnel-v0.1.0/release.json"
      - name: Prove upgrade and recovery from published v0.2.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin refs/tags/v0.2.0:refs/tags/v0.2.0
          gh release download v0.2.0 --pattern release.json --dir "$RUNNER_TEMP/startunnel-v0.2.0"
          pdm run python scripts/prove_published_upgrade.py --release-record "$RUNNER_TEMP/startunnel-v0.2.0/release.json"
      - name: Prove upgrade and recovery from published v0.3.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin refs/tags/v0.3.0:refs/tags/v0.3.0
          gh release download v0.3.0 --pattern release.json --dir "$RUNNER_TEMP/startunnel-v0.3.0"
          pdm run python scripts/prove_published_upgrade.py --release-record "$RUNNER_TEMP/startunnel-v0.3.0/release.json"

  external-proofs:
    name: ${{ matrix.lane }} proof
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane:
          - examples
          - agents
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the isolated proof
        run: >-
          python3 scripts/run_isolated_test_lane.py ${{ matrix.lane }}
          --project-name stci-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}

  browser:
    name: Chromium, Firefox, and WebKit
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the isolated browser lane
        run: >-
          python3 scripts/run_isolated_test_lane.py browser
          --project-name stci-browser-${{ github.run_id }}-${{ github.run_attempt }}
