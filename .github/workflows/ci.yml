name: Continuous integration

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PDM_CHECK_UPDATE: "false"

jobs:
  canonical:
    name: Canonical locked gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the locked tools and dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.28.0"
          pdm install --frozen-lockfile --no-self
          npm ci --ignore-scripts
      - name: Install Perfect Doc
        run: |
          tool_dir="$RUNNER_TEMP/perfect-doc"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive=perfect-doc-0.1.0-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/btfranklin/perfect-doc/releases/download/v0.1.0
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive"
          echo "$tool_dir/perfect-doc-0.1.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Check Markdown structure
        run: perfect-doc check . --offline --no-banner
      - name: Run the canonical gate
        run: pdm run check

  postgres:
    name: PostgreSQL
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the isolated service lane
        run: >-
          python3 scripts/run_isolated_test_lane.py postgres
          --project-name stci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Set up Python for the restored baseline proof
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install locked proof dependencies
        run: |
          python -m pip install --disable-pip-version-check "pdm==2.28.0"
          pdm install --frozen-lockfile --no-self
      - name: Prove admin upgrade on a restored initial baseline
        run: pdm run python scripts/prove_admin_upgrade.py

  external-proofs:
    name: ${{ matrix.lane }} proof
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane:
          - examples
          - agents
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the isolated proof
        run: >-
          python3 scripts/run_isolated_test_lane.py ${{ matrix.lane }}
          --project-name stci-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}

  browser:
    name: Chromium, Firefox, and WebKit
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the isolated browser lane
        run: >-
          python3 scripts/run_isolated_test_lane.py browser
          --project-name stci-browser-${{ github.run_id }}-${{ github.run_attempt }}

  release-candidate:
    name: Validate the distribution image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [canonical, postgres, external-proofs, browser]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-candidate.yml
